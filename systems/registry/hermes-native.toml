name = "hermes-native"
licence = "MIT"
harness = "hermes"
artifact = {name = "hermes-agent", version = "v0.22.2", sha256 = "5593518f908c97c32e0a144f291308674f38a6237995a12df504967e71c4101b"}
write_tools = [{tool = "memory", actions = ["add", "patch", "remove"]}]
read_tools = ["session_search"]
recall = {tool = "session_search", argument_template = {query = "{prompt}"}}
# Directory root includes memories/MEMORY.md, memories/USER.md, state.db and WAL/SHM.
# Only logs and locks are volatile: every subcommand writes HERMES_HOME/logs, and MCP
# discovery creates .mcp-discovery.lock. R12 checkpoints WAL before measuring the tree.
surfaces = [{root = "HERMES_HOME", relative = ".", volatile_paths = [".mcp-discovery.lock", "logs"]}]
# Measured 2026-10-27: the T0 memory-layer host's fresh-install hash (RING0 §13 E4 port mask), equal on two director ports.
fresh_install_hash = "90b51b1eea5b9cf18300baebafe78eaa5547fe00a3531a4a1875c7fdbf8b07a8"
own_model_routes = [
    {role = "compaction", alias = "bicentennial-summariser"},
    {role = "summariser", alias = "bicentennial-summariser"},
]
structured_formats = {}
settle = {kind = "none", bound_s = 0}
machine_class = "light"
benchmark_operator_runs = true
