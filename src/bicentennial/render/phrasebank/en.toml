# The v0.1 English phrase bank. Slots are {subject}, {predicate}, {object} and {when}.
# Not yet human-calibrated (DESIGN §4.4), so calibrated stays false.
# A forget request's {object} is the forgotten predicate, never a value. Quote cells keep {subject}
# inside the quoted proposition and name no speaker.
bank_id = "en-v1"
calibrated = false
when = "Due {when}."
factless = ["Thanks, noted.", "Got it, thanks.", "Okay, talk soon.", "Sounds good."]
forget = ["Please forget {subject}'s {object}.", "Forget {subject}'s {object}, please; drop it from your notes.", "Please stop keeping {subject}'s {object} on record."]

[markers]
assert = ["always", "confirmed", "definitely", "for sure", "from now on", "must"]
hedge = ["maybe", "might", "not sure", "perhaps", "possibly"]
propose = ["could we", "how about", "i suggest", "what if"]
quote = ["quote", "said", "wrote"]

[channels]
chat = "chat"
issue_thread = "chat"
review_comment = "chat"
standup_note = "chat"
mail = "mail"
email_digest = "mail"
ci_log = "log"
tool_result = "none"
file_content = "none"
commit = "none"
calendar = "none"
notes = "none"
tracker = "none"

[cells.assert.stated.soft]
affirm = ["For {subject}, the {predicate} is {object}.", "The {predicate} for {subject} is {object}."]
negate = ["For {subject}, the {predicate} is not {object}.", "The {predicate} for {subject} isn't {object}."]
[cells.assert.stated.hard]
affirm = ["For {subject}, the {predicate} is definitely {object}.", "{subject}'s {predicate} must be {object}, from now on."]
negate = ["For {subject}, the {predicate} must never be {object}.", "{subject}'s {predicate} is definitely not {object}."]
[cells.assert.observed.soft]
affirm = ["Output shows {subject} with {predicate} {object}.", "The record lists {object} as the {predicate} for {subject}."]
negate = ["Output shows {subject} without {predicate} {object}.", "The record does not list {object} as the {predicate} for {subject}."]
[cells.assert.observed.hard]
affirm = ["Confirmed in the output: {subject} has {predicate} {object}.", "The record confirmed {object} as the {predicate} for {subject}."]
negate = ["Confirmed in the output: {subject} does not have {predicate} {object}.", "The record confirmed {object} is not the {predicate} for {subject}."]
[cells.assert.retracted.soft]
affirm = ["Scratch that: the {predicate} for {subject} is no longer {object}.", "Correction, {subject}'s {predicate} is not {object} after all."]
negate = ["Scratch that: the {predicate} for {subject} can be {object} again.", "Correction, I take back that {subject}'s {predicate} is not {object}."]
[cells.assert.retracted.hard]
affirm = ["Correction, confirmed: the {predicate} for {subject} is definitely no longer {object}.", "Scratch that for sure: {subject}'s {predicate} is not {object}."]
negate = ["Correction, confirmed: {object} is definitely allowed again as the {predicate} for {subject}.", "Scratch that for sure: I take back that {subject}'s {predicate} is not {object}."]

[cells.hedge.stated.soft]
affirm = ["Maybe the {predicate} for {subject} is {object}.", "{subject} might go with {object} for the {predicate}."]
negate = ["Maybe the {predicate} for {subject} is not {object}.", "{subject} might skip {object} for the {predicate}."]
[cells.hedge.stated.hard]
affirm = ["Possibly the {predicate} for {subject} is {object}; I lean strongly that way.", "{subject} might well want {object} as the {predicate}."]
negate = ["Possibly the {predicate} for {subject} is not {object}; I lean strongly that way.", "{subject} might well not want {object} as the {predicate}."]
[cells.hedge.observed.soft]
affirm = ["The output maybe shows {object} as the {predicate} for {subject}.", "Not sure, but the log suggests {subject} has {predicate} {object}."]
negate = ["The output maybe shows {object} is not the {predicate} for {subject}.", "Not sure, but the log suggests {subject} lacks {predicate} {object}."]
[cells.hedge.observed.hard]
affirm = ["The output very possibly shows {object} as the {predicate} for {subject}.", "The log strongly suggests, perhaps, that {subject} has {predicate} {object}."]
negate = ["The output very possibly shows {object} is not the {predicate} for {subject}.", "The log strongly suggests, perhaps, that {subject} lacks {predicate} {object}."]
[cells.hedge.retracted.soft]
affirm = ["I might have been wrong that the {predicate} for {subject} is {object}.", "Maybe ignore my note about {subject}'s {predicate} being {object}."]
negate = ["I might have been wrong that the {predicate} for {subject} is not {object}.", "Maybe ignore my note about {subject}'s {predicate} not being {object}."]
[cells.hedge.retracted.hard]
affirm = ["I was very possibly wrong that the {predicate} for {subject} is {object}.", "Perhaps drop my note about {subject}'s {predicate} being {object}; I doubt it now."]
negate = ["I was very possibly wrong that the {predicate} for {subject} is not {object}.", "Perhaps drop my note about {subject}'s {predicate} not being {object}; I doubt it now."]

[cells.propose.stated.soft]
affirm = ["How about {object} as the {predicate} for {subject}?", "What if {subject} used {object} as the {predicate}?"]
negate = ["How about not using {object} as the {predicate} for {subject}?", "What if {subject} dropped {object} as the {predicate}?"]
[cells.propose.stated.hard]
affirm = ["I suggest strongly that {subject} uses {object} as the {predicate}.", "Could we settle on {object} as the {predicate} for {subject}?"]
negate = ["I suggest strongly that {subject} avoids {object} as the {predicate}.", "Could we rule out {object} as the {predicate} for {subject}?"]
[cells.propose.observed.soft]
affirm = ["The output shows {object}; how about keeping it as the {predicate} for {subject}?", "What if we keep the observed {object} as the {predicate} for {subject}?"]
negate = ["The output lacks {object}; how about leaving it out of the {predicate} for {subject}?", "What if we keep {object} out of the {predicate} for {subject}, as observed?"]
[cells.propose.observed.hard]
affirm = ["Given the output, I suggest strongly keeping {object} as the {predicate} for {subject}.", "Could we lock in the observed {object} as the {predicate} for {subject}?"]
negate = ["Given the output, I suggest strongly keeping {object} out of the {predicate} for {subject}.", "Could we rule out the observed {object} as the {predicate} for {subject}?"]
[cells.propose.retracted.soft]
affirm = ["How about we drop {object} as the {predicate} for {subject}?", "What if we take back {object} as the {predicate} for {subject}?"]
negate = ["How about we allow {object} again as the {predicate} for {subject}?", "What if we undo ruling out {object} as the {predicate} for {subject}?"]
[cells.propose.retracted.hard]
affirm = ["I suggest strongly that we withdraw {object} as the {predicate} for {subject}.", "Could we withdraw {object} as the {predicate} for {subject} now?"]
negate = ["I suggest strongly that we allow {object} again as the {predicate} for {subject}.", "Could we lift the rule against {object} as the {predicate} for {subject}?"]

[cells.quote.stated.soft]
affirm = ["It was said that the {predicate} for {subject} is {object}.", "Quote from a note: the {predicate} for {subject} is {object}."]
negate = ["It was said that the {predicate} for {subject} is not {object}.", "Quote from a note: the {predicate} for {subject} is not {object}."]
[cells.quote.stated.hard]
affirm = ["It was said that the {predicate} for {subject} must be {object}.", "Quote from a note: the {predicate} for {subject} is definitely {object}."]
negate = ["It was said that the {predicate} for {subject} must not be {object}.", "Quote from a note: the {predicate} for {subject} is definitely not {object}."]
[cells.quote.observed.soft]
affirm = ["The log wrote that the {predicate} for {subject} is {object}.", "Quote from the output: the {predicate} for {subject} is {object}."]
negate = ["The log wrote that the {predicate} for {subject} is not {object}.", "Quote from the output: the {predicate} for {subject} is not {object}."]
[cells.quote.observed.hard]
affirm = ["The log wrote, confirmed: the {predicate} for {subject} is {object}.", "Quote from the output, confirmed: the {predicate} for {subject} is {object}."]
negate = ["The log wrote, confirmed: the {predicate} for {subject} is not {object}.", "Quote from the output, confirmed: the {predicate} for {subject} is not {object}."]
[cells.quote.retracted.soft]
affirm = ["It was said to disregard that the {predicate} for {subject} is {object}.", "Quote from a later note: the {predicate} for {subject} is no longer {object}."]
negate = ["It was said that the {predicate} for {subject} can be {object} after all.", "Quote from a later note: {object} is fine again as the {predicate} for {subject}."]
[cells.quote.retracted.hard]
affirm = ["It was said that the {predicate} for {subject} is definitely no longer {object}.", "Quote from a later note, confirmed: the {predicate} for {subject} is not {object} anymore."]
negate = ["It was said that {object} is definitely allowed again as the {predicate} for {subject}.", "Quote from a later note, confirmed: {object} is back as the {predicate} for {subject}."]
