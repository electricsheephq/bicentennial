name: Ring 0 developer guide

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ring0-doc:
    name: Ring 0 T0 from the developer guide
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Run the developer guide's T0 commands
        shell: bash
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install -e .
          export PYTHONHASHSEED=0
          bicentennial build --tier T0 --out build/ring0
          mkdir -p runs
          PACK_HASH="$(python -m bicentennial.packs.install install build/ring0/T0 runs/ring0-t0-packs)"
          python -m bicentennial.packs.install verify runs/ring0-t0-packs --pack-hash "$PACK_HASH"
          bicentennial t0 --system reference_store --pack all --packs runs/ring0-t0-packs --pack-hash "$PACK_HASH" --out runs/ring0-t0-reference_store
          python -c 'import json, pathlib; from bicentennial.report.receipt import loop_time; times = [(loop_time(json.loads(p.read_bytes()))[0], p.parent.as_posix()) for p in sorted(pathlib.Path("runs/ring0-t0-reference_store").rglob("receipt.json"))]; [print(ms, "ms", pack) for ms, pack in times]; print("maximum per-pack loop_time:", max(ms for ms, pack in times), "ms")'
      - name: Run the developer guide's T2-lite offline path
        shell: bash
        run: |
          set -e
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install -e .[dev]
          export PYTHONHASHSEED=0
          python -m pytest -q tests/runner/test_t2lite.py::test_full_fake_worker_and_rerun_store_hashes --junitxml=build/t2lite-offline.xml
          python -c 'import xml.etree.ElementTree as E; root = E.parse("build/t2lite-offline.xml").getroot(); assert len(root.findall(".//testcase")) == 1 and not root.findall(".//skipped"), "offline acceptance must pass without skips"'
